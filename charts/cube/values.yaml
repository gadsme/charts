## Override the name
##
nameOverride: ""

## Provide a name to substitute for the full names of resources
##
fullnameOverride: ""

##  Labels to add to all deployed objects
##
commonLabels: {}

## Annotations to add to all deployed objects
##
commonAnnotations: {}

## Extra environment variables to pass on to all pods. The value is evaluated as a template
## e.g:
## extraEnvVars:
##   - name: FOO
##     value: "bar"
##
extraEnvVars: []

## Name of a Config Map containing extra environment variables to pass on to all pods
##
extraEnvVarsFromConfigMap:

## Name of a Secret containing extra environment variables to pass on to all pods
##
extraEnvVarsFromSecret:

image:
  ## Docker image repository
  ##
  repository: cubejs/cube

  ## Docker image tag.
  ##
  tag:

  ## Specify a imagePullPolicy
  ## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
  ##
  pullPolicy: IfNotPresent

  ## Specify a imagePullSecrets
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
  ##
  pullSecrets: []

## Pod Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
## Some admission policies only allow use of non root containers
securityContext:
  enabled: false
  # fsGroup: 1001
  # runAsUser: 1001


config:
  ## The port for a Cube deployment to listen to API connections on
  ##
  apiPort: 4000

  ## The port to listen to Postgres-compatible connections on
  ##
  pgSqlPort:

  ## The superuser name to access the SQL api
  ##
  sqlSuperUser:

  ## The username to access the SQL api
  ##
  sqlUser:

  ## The password to access the SQL api
  ##
  sqlPassword:
  # apiPasswordFromSecret:
  #   name:
  #   key:

  ## If true, enables development mode
  ##
  devMode: false

  ## If true, enables debug logging
  ##
  debug: false

  ## The logging level for Cube
  ##
  logLevel: "warn"

  ## If true, then send telemetry to Cube
  ##
  telemetry: false

  ## The secret key used to sign and verify JWTs. Generated on project scaffold
  ##
  apiSecret:
  # apiSecretFromSecret:
  #   name:
  #   key:

  ## API scopes used to allow or disallow access to REST API endpoints.
  ##
  defaultApiScopes:

  ## The secret key used to enable playground and system apis
  ##
  playgroundAuthSecret:
  # apiSecretFromSecret:
  #   name:
  #   key:

  ## The path where Cube loads schemas from. Defaults to schema
  ##
  schemaPath:

  ## An application ID used to uniquely identify the Cube deployment. Can be different for multitenant setups
  ## Defaults to cubejs
  ##
  app:

  ## If true, this instance of Cube will only query rollup pre-aggregations. Defaults to false
  ##
  rollupOnly:

  ## A comma-separated list of timezones to schedule refreshes for.
  ##
  scheduledRefreshTimezones:

  ## How many queries will be run concurrently per app (tenant)
  ##
  scheduledRefreshQueriesPerAppId:
  
  ## The schema name to use for storing pre-aggregations.
  ## Defaults to dev_pre_aggregations/prod_pre_aggregations for development/production mode
  ##
  preAggregationsSchema:

  ## If true, then use WebSocket for data fetching. Defaults to false
  ##
  webSockets:

  ## The cache and queue driver to use for the Cube deployment. Defaults to cubestore
  ##
  cacheAndQueueDriver:

  ## The number of concurrent connections each query queue has to the database
  ##
  concurrency:

  ## The default row limit in the result set if it's not explicitly specified in an API query.
  ##
  queryDefaultLimit:
  
  ## The maximum row limit in the result set.
  ##
  queryLimit:

  ## The number of seconds without a touch before pre-aggregation is considered orphaned and marked for removal.
  ##
  touchPreAggTimeout:

  ## If true, it enables dropping pre-aggregations that Refresh Worker doesn't touch within touchPreAggTimeout.
  ## Pre-aggregations are touched whenever they are rebuilt or a Refresh Worker checks its freshness.
  ## The first drop will be initiated when the Refresh Worker is able to check freshness for every scheduledRefresh: true pre-aggregation.
  ## If you have multiple Refresh Workers with different data model versions sharing the same Cube Store cluster,
  ## then touches from both refresh workers are respected.
  ##
  dropPreAggWithoutTouch:

  ## A comma-separated list of secret keys accepted when verifying JWTs, used to rotate apiSecret. Takes precedence over apiSecret
  ##
  apiSecrets:
  # apiSecretsFromSecret:
  #   name:
  #   key:

  ## The maximum allowed size for incoming requests, between 100kb and 64mb. Defaults to 50mb
  ##
  maxRequestSize:

  ## The number of milliseconds the server waits to receive the complete HTTP headers. Defaults to the Node.js default
  ##
  serverHeadersTimeout:

  ## The number of milliseconds of inactivity the server waits for more data before closing a socket. Defaults to the Node.js default
  ##
  serverKeepAliveTimeout:

  ## The default time zone for queries. Defaults to UTC
  ##
  defaultTimezone:

  ## If false, Explore and Workbooks wait for an explicit Run query instead of running queries automatically. Defaults to true
  ##
  autoRunMode:

  ## If true, values in SQL API statements are replaced with `redacted` in logs. Defaults to true in production
  ##
  logRedaction:

  ## If true, disables the primary key inclusion check for ungrouped queries. Defaults to false
  ##
  allowUngroupedWithoutPrimaryKey:

  ## The delimiter used to flatten nested folder names in views for tools that do not support nested folders
  ##
  nestedFoldersDelimiter:

  ## A path to a PEM file with extra CA certificates for Node.js to trust (mount it with config.volumes)
  ##
  nodeExtraCaCerts:

  ## The maximum number of compiled data models to keep in the compiler cache. Defaults to 250
  ##
  compilerCacheSize:

  ## If true, data models of different tenants in one process share compiled files and caches. Defaults to false
  ##
  compilerMultiTenantSharing:

  ## The maximum number of compiled members to keep in the compiler cache. No limit by default
  ##
  maxCompiledMembers:

  ## The maximum depth of a chain of members referencing other members (Tesseract only). Defaults to 160
  ##
  maxMemberResolutionDepth:

  ## The maximum number of multi-stage members one query may chain (Tesseract only). Defaults to 150
  ##
  maxMultiStageDepth:

  ## The maximum number of multi-stage stages one query may plan in total (Tesseract only). Defaults to 1000
  ##
  maxMultiStageStages:

  ## The maximum number of partitions each pre-aggregation in a cube can use. Defaults to 10000
  ##
  maxPartitionsPerCube:

  ## The maximum number of source rows read for a rollup_lambda pre-aggregation with union_with_source_data. Defaults to 200000
  ##
  maxSourceRowLimit:

  ## If true, enables Tesseract, the next-generation SQL planner. Enabled by default since Cube v1.7.0
  ##
  tesseractSqlPlanner:

  ## If true, Tesseract combines multi-stage subqueries with UNION ALL and GROUP BY for Cube Store queries. Defaults to true
  ##
  tesseractCubestoreUnionFullKeyAggregate:

  ## Same as tesseractCubestoreUnionFullKeyAggregate, for Trino data sources. Defaults to true
  ##
  tesseractTrinoUnionFullKeyAggregate:

  ## The number of pre-aggregation queries the refresh worker executes concurrently. Defaults to concurrency
  ##
  refreshWorkerConcurrency:

  ## If true, a numeric scheduled_refresh_timer only sets the refresh worker heartbeat interval. Defaults to false
  ##
  scheduledRefreshTimerIntervalOnly:

  ## If true, every-based refresh keys use Cube's own clock instead of querying the database. Defaults to false
  ##
  refreshKeyLocalTime:

  ## If true, enables the experimental fast-track path for Cube Store query queues. Defaults to false
  ##
  queueFastTrack:

  ## If true, this instance builds pre-aggregations even if it is an API instance. Defaults to false in production
  ##
  preAggregationsBuilder:

  ## The maximum time, in seconds, of the exponential backoff between failed pre-aggregation builds. Defaults to 600
  ##
  preAggregationsBackoffMaxTime:

  ## If true, allows non-strict date range matching for pre-aggregations by default. Defaults to true
  ##
  preAggregationsAllowNonStrictDateRangeMatch:

  ## If true, attaches a trace_id SQL comment with the API request ID to queries sent to data sources. Defaults to false
  ##
  sqlIncludeTraceId:

  ## The maximum number of concurrent SQL API sessions. Defaults to 1024
  ##
  maxSessions:

  ## If true, enables query pushdown in the SQL API. Defaults to true
  ##
  sqlPushDown:

  ## If true, queries pushed down by the SQL API can be served from pre-aggregations. Defaults to true
  ##
  sqlPushDownPreAggregations:

  ## If true, enables the streaming mode in the SQL API. Defaults to false
  ##
  sqlStreamMode:

  ## If true, the SQL API rejects queries needing post-processing over a Cube query without a LIMIT. Defaults to false
  ##
  sqlFailOnLimitlessPostProcessing:

  ## The maximum number of rows in one record batch when the SQL API reads data from a cube. Defaults to 65536
  ##
  sqlCubeScanMaxBatchRows:

  ## The maximum row limit for SQL API queries that are not streamed. Defaults to queryLimit
  ##
  sqlNonStreamingQueryMaxRowLimit:

  ## If true, prevents adding an implicit default ORDER BY to SQL API queries. Defaults to true
  ##
  sqlNoImplicitOrder:

  ## The maximum number of e-graph nodes allocated while planning a SQL API query. Defaults to 10000
  ##
  sqlRewriteMaxNodes:

  ## The maximum number of e-graph rewriting iterations while planning a SQL API query. Defaults to 300
  ##
  sqlRewriteMaxIterations:

  ## The maximum time, in seconds, to plan a SQL API query. Defaults to 30
  ##
  sqlRewriteTimeout:

  ## The number of seconds before a SQL API session security context is invalidated. Defaults to 300
  ##
  sqlAuthExpireSecs:

  ## If true, the DAX API exposes time dimensions as calendar hierarchies. Defaults to true
  ##
  daxCreateDateHierarchies:

  ## If true, the DAX API evaluates a SUMMARIZECOLUMNS variable once per request. Defaults to false
  ##
  daxShareVars:

  ## If true, the DAX API exposes all views as a single perspective, enabling cross-view filtering. Defaults to false
  ##
  daxSinglePerspective:

  ## If true, the MDX API creates calendar hierarchies for all time dimensions. Defaults to true
  ##
  mdxCreateDateHierarchies:

  ## The locale for the MDX API, as an LCID or a language tag. Defaults to 1033 (English - United States)
  ##
  xmlaLanguage:

  ## Init containers to run before starting the main container
  ## We can use an empty volume and volume mounts to copy data
  ## from a remote location like s3 to the local volume
  ##
  initContainers: []
  # - name: aws-init-container
  #   image: amazon/aws-cli:latest
  #   command: ['sh', '-c', 'aws s3 cp s3://your-s3-bucket/your-data /path/to/volume/mount']
  #   volumeMounts:
  #   - name: data-volume
  #     mountPath: /path/to/volume/mount

  ## Side containers to run before along with the main container
  ## We can use an empty volume and volume mounts to sync data
  ## from a remote location like s3 to the local volume
  ##
  sidecarContainers: []
  # - name: aws-sync-container
  #   image: amazon/aws-cli:latest
  #   command: ['sh', '-c', 'while true; do aws s3 cp s3://your-s3-bucket/your-data /path/to/volume/mount; sleep 30; done']
  #   volumeMounts:
  #   - name: data-volume
  #     mountPath: /path/to/volume/mount

  ## The config volumes
  ## Will be used to both api and worker
  volumes: []
  ## In case you want to use configMap
  # - name: schema
  #   configMap:
  #     name: schema
  ## In case you want to use init container
  # - name: data-volume
  #   emptyDir: {}

  ## The config volumeMounts
  ## Will be used to both api and worker
  volumeMounts: []
  ## In case you want to use configMap
  # - name: schema
  #   readOnly: true
  #   mountPath: /cube/conf/schema
  ## In case you want to use init container
  # - name: data-volume
  #   readOnly: true
  #   mountPath: /cube/conf/schema
  #   subPath: model

jwt:
  ## A valid URL to a JSON Web Key Sets (JWKS)
  ##
  jwkUrl:

  ## The secret key used to sign and verify JWTs. Generated on project scaffold
  ##
  key:
  # keyFromSecret:
  #   name:
  #   key:

  ## An audience value which will be used to enforce the aud claim from inbound JWTs
  ##
  audience:

  ## An issuer value which will be used to enforce the iss claim from inbound JWTs
  ##
  issuer:

  ## A subject value which will be used to enforce the sub claim from inbound JWTs
  ##
  subject:

  ## Any supported algorithm for decoding JWTs
  ##
  algs:

  ## A namespace within the decoded JWT under which any custom claims can be found
  ##
  claimsNamespace:

## Datasource configuration
##
datasources:
  ## Default datasource
  default:
    ## A database type supported by Cube
    ##
    type:

    ## The URL for a database
    ##
    url:

    ## The host URL for a database
    ##
    host:
    # hostFromSecret:
    #   name:
    #   key:

    ## The port for the database connection
    ##
    port:

    ## The schema within the database to connect to
    ##
    schema:

    ## The name of the database to connect to
    ##
    name:

    ## The username used to connect to the database
    ##
    user:
    # userFromSecret:
    #   name:
    #   key:

    ## The password used to connect to the database
    ##
    pass:
    # passFromSecret:
    #   name:
    #   key:

    ## A domain name within the database to connect to
    ##
    domain:

    ## The path to a Unix socket for a MySQL database
    ##
    socketPath:

    ## The maximum number of connections to keep active in the database connection pool
    ##
    maxPool:

    ## A number in seconds or a duration string
    ##
    queryTimeout:

    ## Force fetching of columns by ordinal positions. Certain data-providers (e.g., Redshift) do not guarantee columns in the same order on each request (e.g., SELECT * FROM foo). This flag ensures that columns will be fetched in proper order for pre-aggregation generation.
    ##
    fetchColumnsByOrdinalPosition:

    ## If true, decimal columns keep their precision and scale when exported to Cube Store. Defaults to false
    ##
    preciseDecimalInCubestore:

    ssl:
      ## If true, enables SSL encryption for database connections from Cube
      ##
      enabled: false

      ## If true, verifies the CA chain with the system's built-in CA chain
      ##
      rejectUnAuthorized:
      ## The contents of a CA bundle in PEM format, or a path to one.
      ## For more information, check the options.ca property for TLS Secure Contexts in the Node.js documentation
      ## https://nodejs.org/docs/latest/api/tls.html#tls_tls_createsecurecontext_options
      ##
      ca:

      ## The contents of an SSL certificate in PEM format, or a path to one.
      ## For more information, check the options.cert property for TLS Secure Contexts in the Node.js documentation
      ## https://nodejs.org/docs/latest/api/tls.html#tls_tls_createsecurecontext_options
      ##
      cert:

      ## The contents of a private key in PEM format, or a path to one.
      ## For more information, check the options.key property for TLS Secure Contexts in the Node.js documentation
      ## https://nodejs.org/docs/latest/api/tls.html#tls_tls_createsecurecontext_options
      ##
      key:

      ## The ciphers used by the SSL certificate.
      ## For more information, check the options.ciphers property for TLS Secure Contexts in the Node.js documentation
      ## https://nodejs.org/docs/latest/api/tls.html#tls_tls_createsecurecontext_options
      ##
      ciphers:

      ## The server name for the SNI TLS extension.
      ## For more information, check the options.servername property for TLS Connections in the Node.js documentation
      ## https://nodejs.org/docs/latest/api/tls.html#tls_tls_createsecurecontext_options
      ##
      serverName:

      ## The passphrase used to encrypt the SSL private key.
      ## For more information, check the options.passphrase property for TLS Secure Contexts in the Node.js documentation
      ## https://nodejs.org/docs/latest/api/tls.html#tls_tls_createsecurecontext_options
      ##
      passPhrase:

    ## Export Bucket configuration
    ##
    export:
      ## The name of a bucket in cloud storage to store the database export snapshots.
      ##
      name:

      ## The cloud provider where the bucket is hosted (gcp, s3)
      ##
      type:

      ## The name of the integration used in the database. Only required when using Snowflake and Google Cloud Storage
      ##
      integration:

      gcs:
        ## A Base64 encoded JSON key file for connecting to Google Cloud
        ##
        credentials:
        # credentialsFromSecret:
        #   name:
        #   key:

      aws:
        ## The AWS Access Key ID to use for the export bucket.
        ##
        key:
        # keyFromSecret:
        #   name:
        #   key:

        ## The AWS Secret Access Key to use for the export bucket.
        ##
        secret:
        # secretFromSecret:
        #   name:
        #   key:

        ## The AWS region of the export bucket.
        ##
        region:

      ## The mount path to use for a Databricks DBFS mount
      ##
      mountDir:

      azure:
        ## The Azure Access Key to use for the export bucket
        ##
        key:
        # keyFromSecret:
        #   name:
        #   key:

        ## The Azure tenant ID to use for the export bucket
        ##
        tenantId:

        ## The Azure client ID to use for the export bucket
        ##
        clientId:

        ## The Azure client secret to use for the export bucket
        ##
        clientSecret:
        # clientSecretFromSecret:
        #   name:
        #   key:

      redshift:
        ## An ARN of an AWS IAM role with permission to write to the configured bucket (see export.name).
        arn:

    ## A dedicated connection used to build and store this data source's pre-aggregations (CUBEJS_PRE_AGGREGATIONS_*). Accepts the same keys as the data source itself. Configure it in full: only type is inherited, unset keys fall back to driver defaults. ssl.ca/cert/key/ciphers/serverName/passPhrase are not supported, Cube uses the main connection's
    ## e.g:
    ## preAggregations:
    ##   host: preagg-db.example.com
    ##   user: cube
    ##   passFromSecret:
    ##     name: preagg-db
    ##     key: password
    ##
    preAggregations: {}

    athena:
      ## The AWS Access Key ID to use for database connections
      ##
      key:
      # keyFromSecret:
      #   name:
      #   key:

      ## The AWS region of the Cube deployment
      ##
      region:

      ## The S3 path to store query results made by the Cube deployment
      ##
      s3OutputLocation:

      ## The AWS Secret Access Key to use for database connections
      ##
      secret:
      # secretFromSecret:
      #   name:
      #   key:

      ## The name of the workgroup in which the query is being started
      ##
      workgroup:

      ## The name of the catalog to use by default
      ##
      catalog:

      ## The ARN of the IAM role to assume for Athena access
      ##
      assumeRoleArn:

      ## The external ID to use when assuming the IAM role, if required by its trust policy
      ##
      assumeRoleExternalId:

    bigquery:
      ## The Google BigQuery project ID to connect to
      ##
      projectId:

      ## The Google BigQuery dataset location to connect to
      ##
      location:

      ## A Base64 encoded JSON key file for connecting to Google BigQuery
      ##
      credentials:
      # credentialsFromSecret:
      #   name:
      #   key:

      ## The path to a JSON key file for connecting to Google BigQuery
      ##
      keyFile:

    duckdb:
      ## The maximum memory limit for DuckDB. Equivalent to SET memory_limit=<MEMORY_LIMIT>. Default is 75% of available RAM
      ##
      memoryLimit:

      ## The default search schema
      ##
      schema:

      ## The service token to use for connections to MotherDuck
      ##
      motherduckToken:

      ## The database filepath to use for connection to a local
      ##
      databasePath:

      ## A comma-separated list of DuckDB extensions to install and load
      ##
      extensions:

      ## A comma-separated list of DuckDB community extensions to install and load
      ##
      communityExtensions:

      s3:
        ## The Access Key ID to use for database
        ##
        accessKeyId:

        ## The Secret Access Key to use for database
        ##
        secretAccessKey:
        # secretAccessKeyFromSecret:
        #   name:
        #   key:

        ## The S3 endpoint
        ##
        endpoint:

        ## The region of the bucket
        ##
        region:

        ## Use SSL for connection
        ##
        useSSL:

        ## To choose the S3 URL style(vhost or path)
        ##
        urlStyle:

        ## The token for the S3 session
        ##
        sessionToken:

        ## If true, uses the credentials chain for S3 secrets. Defaults to false
        ##
        useCredentialChain:

    hive:
      ## The version of the CDH instance for Apache Hive
      ##
      cdhVersion:

      ## The version of Thrift Server for Apache Hive
      ##
      thriftVersion:

      ## The type of Apache Hive server
      ##
      type:

      ## The version of Apache Hive
      version:

    materialize:
      ## The name of the Materialize cluster to connect to
      ##
      cluster: 

    snowFlake:
      ## The Snowflake account ID to use when connecting to the database
      ##
      account:

      ## The Snowflake region to use when connecting to the database
      ##
      region:

      ## The Snowflake role to use when connecting to the database
      ##
      role:

      ## The Snowflake warehouse to use when connecting to the database
      ##
      warehouse:

      ## If true, keep the Snowflake connection alive indefinitely
      ##
      clientSessionKeepAlive:

      ## The type of authenticator to use with Snowflake.
      ## Use SNOWFLAKE with username/password, or SNOWFLAKE_JWT with key pairs.
      ## Defaults to SNOWFLAKE
      ##
      authenticator:

      ## The path to the private RSA key folder
      ##
      privateKeyPath:

      ## The password for the private RSA key. Only required for encrypted keys
      ##
      privateKeyPass:

      ## The host address the driver should connect to
      ##
      host:

      ## The content of the private RSA key (encrypted or not)
      ##
      privateKey:
      # privateKeyFromSecret:
      #   name:
      #   key:

      ## The OAuth token to use with Snowflake
      ##
      oauthToken:
      # oauthTokenFromSecret:
      #   name:
      #   key:

      ## The path to the file containing the OAuth token
      ##
      oauthTokenPath:

      ## Whether quoted identifiers should be case insensitive. Defaults to false
      ##
      quotedIdentifiersIgnoreCase:

    databricks:
      ## The URL for a JDBC connection
      ##
      url:

      ## Whether or not to accept the license terms for the Databricks JDBC driver
      ##
      acceptPolicy:

      ## The personal access token used to authenticate the Databricks connection
      ##
      token:

      ## Databricks catalog name
      ##
      catalog:

      ## The OAuth client ID for service principal authentication
      ##
      oauthClientId:

      ## The OAuth client secret for service principal authentication
      ##
      oauthClientSecret:
      # oauthClientSecretFromSecret:
      #   name:
      #   key:

    clickhouse:
      ## Whether the ClickHouse user has read-only access or not
      ##
      readonly:

      ## Whether the ClickHouse client has compression enabled or not
      ##
      compression:

    firebolt:
      ## Account name
      ##
      account:

      ## Engine name to connect to
      ##
      engineName:

      ## Firebolt API endpoint. Used for authentication
      ##
      apiEndpoint:

    presto:
      ## The catalog within Presto to connect to
      ##
      catalog:

      ## The authentication token sent in the Authorization header
      ##
      authToken:
      # authTokenFromSecret:
      #   name:
      #   key:

    trino:
      ## The catalog within Trino to connect to
      ##
      catalog:
      ## The authentication token sent in the Authorization header
      ##
      authToken:
      # authTokenFromSecret:
      #   name:
      #   key:

    kafka:
      ## Kafka broker host(s) for Kafka streams mode, comma-separated
      ##
      host:

      ## The username for Kafka broker authentication (SASL PLAIN)
      ##
      user:

      ## The password for Kafka broker authentication (SASL PLAIN)
      ##
      pass:
      # passFromSecret:
      #   name:
      #   key:

      ## If true, enables SASL_SSL for the Kafka connection. Defaults to false
      ##
      useSsl:

    mssql:
      ## If true, time zone names are used in generated SQL instead of numeric offsets. Defaults to false
      ##
      useNamedTimezones:

    mysql:
      ## If true, time zone names are used in generated SQL instead of numeric offsets. Defaults to false
      ##
      useNamedTimezones:

    pinot:
      ## The authentication token for StarTree, passed as an HTTP header
      ##
      authToken:
      # authTokenFromSecret:
      #   name:
      #   key:

      ## If true, enables null value support. Defaults to false
      ##
      nullHandling:

    redshift:
      ## The Redshift cluster identifier. Required for IAM authentication
      ##
      clusterIdentifier:

      ## The AWS region of the Redshift cluster. Required for IAM authentication
      ##
      awsRegion:

      ## The ARN of the IAM role to assume for cross-account access
      ##
      assumeRoleArn:

      ## The external ID for the assumed role's trust policy
      ##
      assumeRoleExternalId:

## Cubestore configuration
##
cubestore:
  ## The hostname of the Cube Store deployment
  ##
  host:

  ## The port of the Cube Store deployment
  ##
  port: 3030

  ## The maximum size in bytes of a single message sent to or accepted from Cube Store. Defaults to 104857600 (100 MB)
  ##
  maxMessageSize:

api:
  ## Service account for cube api to use
  ##
  serviceAccount:
    create: false
    name: ""
    automountServiceAccountToken: true
    annotations: {}

  apiCount: 1

  ## Affinity for pod assignment
  ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  ##
  affinity: {}

  ## Topology spread constraint for pod assignment
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
  ##
  spreadConstraints: []

  ## Define resources requests and limits for single Pods.
  ## ref: https://kubernetes.io/docs/user-guide/compute-resources/
